<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Call QA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
    <form class="login-card glass-panel" id="loginForm">
        <div class="brand">
            <div class="nvidia-badge">QA</div>
            <div class="brand-title">Sales Call <span>Intelligence</span></div>
        </div>
        <p class="login-hint">This instance is password protected.</p>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus required>
        <button type="submit" class="tab active" id="submitBtn">Sign in</button>
        <p class="login-error hidden" id="error"></p>
    </form>
<script src="login.js"></script>
</body>
</html>
